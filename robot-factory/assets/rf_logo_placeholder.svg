<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 50" width="240" height="50">
  <!-- Cherry Red Logo Badge -->
  <rect x="0" y="5" width="40" height="40" rx="8" fill="#C62828"/>
  <!-- Gear / Robot Icon inside Badge -->
  <circle cx="20" cy="25" r="10" stroke="#FFFFFF" stroke-width="3" fill="none"/>
  <circle cx="20" cy="25" r="4" fill="#FFFFFF"/>
  <rect x="18" y="10" width="4" height="6" fill="#FFFFFF"/>
  <rect x="18" y="34" width="4" height="6" fill="#FFFFFF"/>
  <rect x="10" y="23" width="6" height="4" fill="#FFFFFF"/>
  <rect x="34" y="23" width="6" height="4" fill="#FFFFFF"/>
  
  <!-- Text: ROBOT FACTORY -->
  <text x="50" y="30" font-family="'Roboto', sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" letter-spacing="1">ROBOT</text>
  <text x="135" y="30" font-family="'Roboto', sans-serif" font-weight="700" font-size="20" fill="#C62828" letter-spacing="1">FACTORY</text>
  <text x="50" y="42" font-family="'Roboto', sans-serif" font-weight="500" font-size="9" fill="#BDBDBD" letter-spacing="0.5">TAK ROBOTICS ACADEMY</text>
</svg>

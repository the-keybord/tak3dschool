<!DOCTYPE html>
<html lang="ro">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TAK Academy Dashboard - Selectează cursul dorit.">
  <title>TAK Academy | Dashboard Cursuri</title>
  <link rel="stylesheet" href="style.css?v=2.0">
</head>

<body class="dashboard-body">

  <!-- Minimal Dashboard Header -->
  <header id="header" class="dashboard-header">
    <div class="header-container dashboard-header-container">
      <a href="./" class="logo">
        <img src="takLogoForSite.png" alt="TAK Academy Logo" class="logo-img" style="height: 52px; width: auto; display: block;">
      </a>
    </div>
  </header>

  <!-- Dashboard Main Content: Course Cards Only -->
  <main class="dashboard-main">
    <div class="container">
      <div class="courses-grid">

        <!-- Course 1: 3D School -->
        <a href="3d/" class="course-card-simple">
          <div class="card-logo-wrapper">
            <img src="3dschoolLogoForSite.png" alt="3D School Logo" class="card-logo-img">
          </div>
          <div class="card-info-simple">
            <h3 class="card-title-simple">3D School</h3>
            <p class="card-mentor-simple">cu Bocancea Andrian</p>
          </div>
          <span class="btn btn-primary card-btn-simple">Accesează Cursul &rarr;</span>
        </a>

        <!-- Course 2: Robot Factory -->
        <a href="robot-factory/" class="course-card-simple course-card-rf">
          <div class="card-logo-wrapper">
            <img src="rfLogoforSite.png" alt="Robot Factory Logo" class="card-logo-img">
          </div>
          <div class="card-info-simple">
            <h3 class="card-title-simple">Robot Factory</h3>
            <p class="card-mentor-simple">cu Bocancea Andrian și Cristian Romanciuc</p>
          </div>
          <span class="btn btn-rf card-btn-simple">Accesează Cursul &rarr;</span>
        </a>

      </div>
    </div>
  </main>

  <!-- Dashboard Footer -->
  <footer class="dashboard-footer">
    <div class="container footer-content">
      <p>&copy; 2026 TAK Academy (curs.tak.md). Toate drepturile rezervate.</p>
    </div>
  </footer>

</body>

</html>

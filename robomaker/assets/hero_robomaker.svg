<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <!-- Light background container -->
  <rect width="400" height="300" rx="16" fill="#F8F9FA" stroke="#E0E0E0" stroke-width="2"/>
  
  <!-- Subtle Light Grid Pattern -->
  <defs>
    <pattern id="makergrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#EAEAEA" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="url(#makergrid)"/>
  
  <!-- RoboMaker Main Structure -->
  <!-- Head -->
  <rect x="150" y="50" width="100" height="70" rx="10" fill="#FFFFFF" stroke="#EF3B24" stroke-width="3"/>
  <!-- Eyes -->
  <circle cx="175" cy="85" r="12" fill="#EF3B24"/>
  <circle cx="225" cy="85" r="12" fill="#EF3B24"/>
  <circle cx="175" cy="85" r="4" fill="#FFFFFF"/>
  <circle cx="225" cy="85" r="4" fill="#FFFFFF"/>
  <!-- Antenna -->
  <line x1="200" y1="50" x2="200" y2="30" stroke="#EF3B24" stroke-width="3"/>
  <circle cx="200" cy="25" r="6" fill="#EF3B24"/>
  
  <!-- Body -->
  <rect x="130" y="130" width="140" height="110" rx="12" fill="#FFFFFF" stroke="#EF3B24" stroke-width="3"/>
  <!-- Circuit board inside body -->
  <rect x="150" y="150" width="100" height="70" rx="6" fill="#FFEBEE" stroke="#EF3B24" stroke-width="1.5"/>
  <circle cx="170" cy="170" r="6" fill="#EF3B24"/>
  <circle cx="190" cy="170" r="6" fill="#212121"/>
  <circle cx="210" cy="170" r="6" fill="#EF3B24"/>
  <rect x="165" y="190" width="70" height="18" rx="3" fill="#EF3B24"/>
  <text x="200" y="203" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">ROBOMAKER</text>
  
  <!-- Base / Track -->
  <rect x="100" y="240" width="50" height="35" rx="6" fill="#424242" stroke="#EF3B24" stroke-width="2"/>
  <rect x="250" y="240" width="50" height="35" rx="6" fill="#424242" stroke="#EF3B24" stroke-width="2"/>
  
  <text x="200" y="284" fill="#757575" font-family="sans-serif" font-size="11" font-weight="500" text-anchor="middle">RoboMaker Kit Placeholder</text>
</svg>
